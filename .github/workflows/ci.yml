# ============================================================
# CI Workflow — Continuous Integration
# Runs on every push to any feature branch
# Purpose: catch broken code before Pull Request
# ============================================================

name: CI — Run Tests

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Python 3.11
      # Same version as our Dockerfile
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3 — Cache pip dependencies
      # If requirements.txt has not changed — use cached packages
      # Speeds up CI significantly
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4 — Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5 — Verify settings load correctly
      # Catches missing environment variables early
      - name: Verify settings
        env:
          GCP_PROJECT_ID: test-project
          LANGSMITH_API_KEY: test-key
          ENVIRONMENT: test
        run: |
          python -c "from src.config.settings import get_settings; print('Settings OK')"

      # Step 6 — Run unit tests
      - name: Run unit tests
        env:
          GCP_PROJECT_ID: test-project
          LANGSMITH_API_KEY: test-key
          ENVIRONMENT: test
        run: |
          pytest tests/unit/ -v --tb=short

      # Step 7 — Run integration tests
      - name: Run integration tests
        env:
          GCP_PROJECT_ID: test-project
          LANGSMITH_API_KEY: test-key
          ENVIRONMENT: test
        run: |
          pytest tests/integration/ -v --tb=short